# appmanagement.automateit.se -> App Management for IoT Open Edge Apps (github.com/automateit-se/appmanagement)
server {
    listen      8080;
    server_name appmanagement.automateit.se;

    location / {
        # A variable makes nginx look the name up per request instead of at start-up.
        set $upstream http://appmanagement:8080;
        proxy_pass $upstream;
        include /etc/nginx/snippets/proxy.conf;
    }
}
