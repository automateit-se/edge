# dashboard.automateit.se -> IoT Open dashboard (github.com/automateit-se/iotopen-dashboard)
server {
    listen      8080;
    server_name dashboard.automateit.se;

    location / {
        # A variable makes nginx look the name up per request instead of at start-up.
        set $upstream http://iotopen-dashboard:8080;
        proxy_pass $upstream;
        include /etc/nginx/snippets/proxy.conf;
    }
}
