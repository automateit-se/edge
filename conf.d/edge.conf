# Loaded into the http block of nginx.

# Real client address. The edge is only published on 127.0.0.1, so every request comes from cloudflared on
# this host through the Docker network gateway, and Cloudflare's CF-Connecting-IP header can be trusted.
real_ip_header   CF-Connecting-IP;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 127.0.0.1;

# Docker's embedded DNS. Upstream names are looked up per request (see sites/*.conf), so the edge starts
# and keeps serving the other sites even when one app container is stopped.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default  upgrade;
    ""       close;
}

server_tokens off;
log_format edge '$remote_addr $host "$request" $status $body_bytes_sent $request_time "$http_user_agent"';
access_log /dev/stdout edge;

# Host names without a site file: nothing is published by accident.
server {
    listen      8080 default_server;
    server_name _;

    location = /healthz {
        access_log   off;
        default_type text/plain;
        return 200 'ok';
    }

    location / {
        return 404;
    }
}

include /etc/nginx/sites/*.conf;
